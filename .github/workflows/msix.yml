name: MSIX package and installed lifecycle
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  msix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          tools: tools_mingw1310
          dir: ${{ github.workspace }}/.deps
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - name: Cache locked MPP reader inputs
        uses: actions/cache@v6
        with:
          path: .cache/mpp-reader-inputs
          key: mpp-reader-inputs-${{ hashFiles('packaging/mpp-reader/engine-lock.json') }}
      - name: Prepare offline MPP reader before build and tests
        run: |
          python -m unittest discover -s tests -p test_prepare_ci_mpp_reader.py -v
          python scripts/prepare-ci-mpp-reader.py --output build/mpp-reader
      - name: Configure Release MinGW
        shell: pwsh
        run: |
          $compiler = "$env:GITHUB_WORKSPACE/.deps/Qt/Tools/mingw1310_64/bin"
          $compiler | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:PATH = "$compiler;$env:PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_COMPILER=$compiler/g++.exe" "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
      - name: Verify packaging contracts and pinned Microsoft SDK
        run: |
          python -m unittest discover -s tests -p "test_*packaging.py" -v
          python scripts/setup-msix-tools.py
      - name: Build development packages and upgrade fixture
        run: |
          git status --short
          python scripts/package-msix.py --version 1.0.2.0
          python scripts/package-msix.py --version 1.0.2.0 --include-probe
          python scripts/package-msix.py --version 1.0.3.0 --include-probe
      - name: Install activate update recover and uninstall with package identity
        shell: powershell
        run: |
          $initial = (Get-Item build/msix-development/PPM-development-1.0.2.0-x64-*-probe.msix).FullName
          $upgrade = (Get-Item build/msix-development/PPM-development-1.0.3.0-x64-*-probe.msix).FullName
          ./scripts/check-msix-lifecycle.ps1 -InitialPackage $initial -UpgradePackage $upgrade
      - name: Verify update service and native widgets
        run: |
          cmake --build build --target jobs_update_tests --parallel 3
          ctest --test-dir build -R "^application_updates$" --output-on-failure
      - name: Preserve package validation logs and actual UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: msix-validation-windows-x64
          path: |
            build/msix-acceptance/**/*.json
            build/msix-acceptance/**/*.png
            build/msix-acceptance/**/*.log
            build/updates-ctest.txt
            build/packages/**/makeappx.log
            build/packages/**/windeployqt.log
          if-no-files-found: error
