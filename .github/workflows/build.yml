name: Desktop build and file lifecycle
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: win64_msvc2022_64
          - os: macos-15
            arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare the action artifact contract fixture
        run: |
          python -m unittest discover -s tests -p test_ci_action_artifacts.py -v
          python -m unittest discover -s tests -p test_mac_store_packaging.py -v
          python scripts/check-ci-action-artifacts.py prepare build/ci-action-artifacts/input
      - name: Upload the ZIP artifact contract fixture
        id: action_artifact
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: action-runtime-contract-${{ runner.os }}
          path: build/ci-action-artifacts/input/
          if-no-files-found: error
      - name: Download with the release workflow token and run-id contract
        uses: actions/download-artifact@v8
        with:
          name: action-runtime-contract-${{ runner.os }}
          path: build/ci-action-artifacts/restored
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Verify downloaded bytes and the REST ZIP archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-ci-action-artifacts.py verify build/ci-action-artifacts/input build/ci-action-artifacts/restored --artifact-id "${{ steps.action_artifact.outputs.artifact-id }}"
      - name: Select Qt 6.8 compatible macOS SDK
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - name: Cache locked MPP reader inputs
        uses: actions/cache@v6
        with:
          path: .cache/mpp-reader-inputs
          key: mpp-reader-inputs-${{ hashFiles('packaging/mpp-reader/engine-lock.json') }}
      - name: Prepare offline MPP reader before build and tests
        run: |
          python -m unittest discover -s tests -p test_prepare_ci_mpp_reader.py -v
          python scripts/prepare-ci-mpp-reader.py --output build/mpp-reader
      - name: Install optional server test runtime
        run: python -m pip install -r server/requirements-lock.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJOBS_SERVER_TEST_PYTHON=python
      - name: Verify macOS offscreen PDF text before the full build
        if: runner.os == 'macOS'
        run: |
          cmake --build build --config Release --target jobs_report_tests --parallel 3
          cmake -E chdir build ./jobs_report_tests -platform offscreen
          python -m pip install openpyxl==3.1.5 pypdf==6.10.0
          python scripts/verify-report-fixtures.py build
      - name: Preserve macOS PDF font samples
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: pdf-font-smoke-macOS
          path: |
            build/reports-*.pdf
            build/reports-*.xlsx
          if-no-files-found: warn
      # Bound compiler memory for the Qt translation units on hosted runners.
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Preserve authenticated server integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: server-auth-sync-scheduler-${{ runner.os }}
          path: |
            build/server-qa/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Capture task and Gantt workspace presentation
        run: python scripts/capture-workspace-ui.py build --store
      - name: Preserve task and Gantt workspace screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: workspace-presentation-${{ runner.os }}
          path: build/workspace-ui/
          if-no-files-found: error
      - name: Exercise native multi-project windows and shared resource load
        run: python scripts/check-workspace-native.py build
      - name: Verify workspace scaling and realistic 10k XER
        run: |
          python scripts/check-workspace-scaling.py --build-dir build
          python scripts/check-editing-polish-native.py --build-dir build
          python scripts/make-xer-performance-fixture.py --tasks 10000 --output build/large-xer-fixture
          python scripts/run-large-xer-ui-probe.py --build-dir build --input build/large-xer-fixture/industrial-campus-10000.xer --output build/large-xer-performance/result.json
      - name: Preserve scaling and 10k XER samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: large-xer-scaling-${{ runner.os }}
          path: |
            build/workspace-scaling/
            build/editing-polish-native/
            build/large-xer-fixture/
            build/large-xer-performance/
          if-no-files-found: warn
      - name: Preserve workspace screen and acceptance log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: workspace-${{ runner.os }}
          path: |
            build/workspace-ui.png
            build/workspace-native.log
          if-no-files-found: warn
      - name: Verify exported XLSX and PDF with independent readers
        run: |
          python -m pip install openpyxl==3.1.5 pypdf==6.10.0
          python scripts/verify-report-fixtures.py build
          python scripts/verify-native-period-evm.py build > build/native-period-evm-qa/independent-reader.json
          python scripts/verify-external-xer-evm.py build > build/external-xer-evm-qa/independent-reader.json
          python scripts/verify-custom-financial-periods.py build > build/custom-financial-periods-qa/independent-reader.json
          python scripts/verify-project-xml.py build
          python scripts/verify-progress-policy-adoption.py build > build/progress-policy-adoption-qa/independent-reader.json
          python scripts/verify-progress-leveling.py build > build/progress-leveling-qa/independent-reader.json
          python scripts/verify-leveling-decisions.py build > build/leveling-decision-qa/independent-reader.json
          python scripts/verify-object-fields.py build > build/object-fields-qa/independent-reader.json
          python scripts/verify-assignment-periods.py build > build/assignment-periods-qa/independent-reader.json
          python scripts/verify-print-network.py build > build/print-network-qa/independent-reader.json
          python scripts/verify-activity-extensions.py build > build/activity-extension-qa/independent-reader.json
          python scripts/verify-governance-risk.py build
          python scripts/verify-leveling-float.py build > build/leveling-float-qa/independent-reader.json
          python scripts/verify-segment-leveling-float.py build > build/segment-leveling-float-qa/independent-reader.json
          python scripts/verify-repartition-float.py build > build/repartition-float-qa/independent-reader.json
          python scripts/verify-scaled-repartition-float.py build > build/scaled-repartition-float-qa/independent-reader.json
          python scripts/verify-leveling-witness.py build > build/leveling-witness-qa/independent-reader.json
          python scripts/verify-expanded-repartition-float.py build > build/expanded-repartition-float-qa/independent-reader.json
          python scripts/verify-candidate-propagation.py build > build/candidate-propagation-qa/independent-reader.json
          python scripts/verify-nonmonotone-propagation.py build > build/nonmonotone-propagation-qa/independent-reader.json
          python scripts/verify-propagation-cost.py build > build/propagation-cost-qa/independent-reader.json
      - name: Measure deterministic 1k and 10k schedules and UI
        run: python scripts/run-performance-probes.py --repeats 3
      - name: Measure cell edits and retained undo at 1k and 10k tasks
        run: python scripts/run-editing-performance-probes.py --repeats 7
      - name: Measure request worker and GUI commit phases
        run: python scripts/run-responsive-performance-probes.py --repeats 3
      - name: Check out pre-optimization editing reference
        uses: actions/checkout@v7
        with:
          ref: ae8d9edaa360388012fdb98cd79b633192919971
          path: build/editing-reference-source
      - name: Build reference with the same Qt and compiler
        run: |
          cmake -E copy tests/BulkPerformanceProbe.cpp build/editing-reference-source/tests/BulkPerformanceProbe.cpp
          cmake -E copy tests/ProjectedViewPerformanceProbe.cpp build/editing-reference-source/tests/ProjectedViewPerformanceProbe.cpp
          cmake -S build/editing-reference-source -B build/editing-reference-build -DCMAKE_BUILD_TYPE=Release
          cmake --build build/editing-reference-build --config Release --target jobs_editing_performance_probe jobs_responsive_performance_probe jobs_bulk_performance_probe jobs_projected_view_probe --parallel 3
      - name: Measure reference and compare paired editing observations
        run: |
          python scripts/run-editing-performance-probes.py --build-dir build/editing-reference-build --output-dir build/performance/editing-reference --repeats 7 --allow-short-history
          python scripts/compare-editing-performance.py build/performance/editing-reference build/performance/editing build/performance/editing-comparison.json
          python scripts/run-responsive-performance-probes.py --build-dir build/editing-reference-build --output-dir build/performance/responsive-reference --repeats 3
          python scripts/compare-responsive-performance.py build/performance/responsive-reference build/performance/responsive build/performance/responsive-comparison.json
      - name: Measure paired bulk UI operations
        run: |
          python scripts/run-bulk-performance-probes.py --build-dir build/editing-reference-build --output-dir build/performance/bulk-reference
          python scripts/run-bulk-performance-probes.py --reference build/performance/bulk-reference
      - name: Measure paired filtered sorted and WBS view operations
        run: |
          python scripts/run-projected-view-probes.py --build-dir build/editing-reference-build --output-dir build/performance/projected-views-reference
          python scripts/run-projected-view-probes.py --reference build/performance/projected-views-reference
      - name: Exercise native projected views and publication races
        run: python scripts/check-projected-views-native.py build
      - name: Preserve projected view evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: projected-views-${{ runner.os }}
          path: build/projected-views-native.png
          if-no-files-found: warn
      - name: Exercise native structural editing and row notifications
        run: python scripts/check-bulk-native-ui.py build
      - name: Preserve native structural editing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: bulk-editing-${{ runner.os }}
          path: build/bulk-editing-native.png
          if-no-files-found: warn
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify XER with independent TSV and MPXJ readers
        run: |
          python -m pip install mpxj==16.10.0 JPype1==1.6.0
          python scripts/verify-primavera-xer.py build
          python scripts/verify-xer-actual-costs.py build > build/xer-actual-cost-qa/independent-reader.json
          python scripts/verify-xer-financials.py build > build/xer-financial-qa/independent-reader.json
          python scripts/verify-xer-allocation.py build > build/xer-allocation-qa/independent-reader.json
          python scripts/verify-xer-merge.py build > build/xer-merge-qa/independent-reader.json
          python scripts/verify-xer-relink.py build > build/xer-relink-qa/independent-reader.json
          python scripts/create-xer-batch-fixture.py build
          python scripts/verify-xer-batch.py build/xer-batch-qa/package > build/xer-batch-qa/independent-reader.json
          python scripts/verify-xer-project-selection.py build > build/xer-selection-qa/independent-reader.json
          python scripts/verify-p6-roundtrip.py --kit build/progress-policy-qa/p6-kit --self-test --mpxj-reopen > build/progress-policy-qa/comparator-selftest.json
          python scripts/verify-p6-corpus.py --build-dir build --corpus tests/fixtures/p6-public --output build/p6-public-comparison
          python scripts/fetch-p6-external-samples.py --output build/p6-external
          python scripts/verify-p6-corpus.py --build-dir build --corpus build/p6-external --output build/p6-external-comparison
      - name: Preserve material and integrated workspace evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: resource-integrated-workspace-${{ runner.os }}
          path: |
            build/resource-plan-qa/
            build/integrated-workspace-qa/
            build/resource-workspace-ui-qa/
          if-no-files-found: warn
      - name: Preserve activity extension evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: activity-extensions-${{ runner.os }}
          path: |
            build/activity-extension-qa/
            build/activity-policy-comparison.json
          if-no-files-found: warn
      - name: Preserve print and network extension evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: print-network-${{ runner.os }}
          path: build/print-network-qa/
          if-no-files-found: warn
      - name: Preserve assignment period evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: assignment-periods-${{ runner.os }}
          path: build/assignment-periods-qa/
          if-no-files-found: warn
      - name: Preserve object custom field evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: object-fields-${{ runner.os }}
          path: build/object-fields-qa/
          if-no-files-found: warn
      - name: Preserve leveling decision history evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: leveling-decisions-${{ runner.os }}
          path: build/leveling-decision-qa/
          if-no-files-found: warn
      - name: Preserve post-leveling float and critical path evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: leveling-float-${{ runner.os }}
          path: build/leveling-float-qa/
          if-no-files-found: warn
      - name: Preserve repartition float evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: repartition-float-${{ runner.os }}
          path: build/repartition-float-qa/
          if-no-files-found: warn
      - name: Preserve scaled repartition float evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: scaled-repartition-float-${{ runner.os }}
          path: build/scaled-repartition-float-qa/
          if-no-files-found: warn
      - name: Preserve leveling witness UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: leveling-witness-${{ runner.os }}
          path: build/leveling-witness-qa/
          if-no-files-found: warn
      - name: Preserve expanded repartition evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: expanded-repartition-${{ runner.os }}
          path: build/expanded-repartition-float-qa/
          if-no-files-found: warn
      - name: Preserve candidate propagation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: candidate-propagation-${{ runner.os }}
          path: build/candidate-propagation-qa/
          if-no-files-found: warn
      - name: Preserve propagation cost decision evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: propagation-cost-${{ runner.os }}
          path: build/propagation-cost-qa/
          if-no-files-found: warn
      - name: Preserve nonmonotone demand propagation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: nonmonotone-propagation-${{ runner.os }}
          path: build/nonmonotone-propagation-qa/
          if-no-files-found: warn
      - name: Preserve cross-split leveling float evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: segment-leveling-float-${{ runner.os }}
          path: build/segment-leveling-float-qa/
          if-no-files-found: warn
      - name: Preserve combined progress policy and leveling evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: progress-leveling-${{ runner.os }}
          path: build/progress-leveling-qa/
          if-no-files-found: warn
      - name: Preserve adopted progress policy screens and independent exports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: progress-policy-adoption-${{ runner.os }}
          path: build/progress-policy-adoption-qa/
          if-no-files-found: warn
      - name: Preserve native progress comparison and unexecuted P6 kit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: progress-policy-${{ runner.os }}
          path: build/progress-policy-qa/
          if-no-files-found: warn
      - name: Preserve batch XER diagnostics and screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: xer-batch-${{ runner.os }}
          path: build/xer-batch-qa/
          if-no-files-found: warn
      - name: Preserve selected-project XER diagnostics and screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: xer-project-selection-${{ runner.os }}
          path: build/xer-selection-qa/
          if-no-files-found: warn
      - name: Preserve local organization risk automation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: organization-risk-automation-${{ runner.os }}
          path: build/governance-qa/
          if-no-files-found: warn
      - name: Preserve independent public P6 comparison matrices
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: p6-public-comparison-${{ runner.os }}
          path: |
            build/p6-public-comparison/matrix.json
            build/p6-public-comparison/jobs.json
            build/p6-public-comparison/jobs.log
            build/p6-external-comparison/matrix.json
            build/p6-external-comparison/jobs.json
            build/p6-external-comparison/jobs.log
          if-no-files-found: warn
      - name: Capture native task editing screen
        run: python scripts/capture-task-editing-ui.py build
      - name: Exercise native model and cancellable editing
        run: python scripts/capture-model-async-ui.py build
      - name: Exercise native incremental refresh and WBS fallbacks
        run: python scripts/check-responsive-native-ui.py build
      - name: Preserve model and async editing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: model-async-editing-${{ runner.os }}
          path: |
            build/async-editing-ui.png
            build/async-editing-ui.json
          if-no-files-found: warn
      - name: Exercise native Project XML dialogs
        run: python scripts/capture-project-xml-ui.py build
      - name: Exercise native Primavera XER dialogs
        run: python scripts/capture-primavera-xer-ui.py build
      - name: Preserve Primavera XER evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: primavera-xer-${{ runner.os }}
          path: |
            build/xer-actual-cost-qa/
            build/xer-financial-qa/
            build/xer-allocation-qa/
            build/xer-merge-qa/
            build/xer-relink-qa/
              build/native-period-evm-qa/
              build/native-period-evm-ui-qa/
              build/external-xer-evm-qa/
              build/external-xer-evm-ui-qa/
            build/custom-financial-periods-qa/
            build/custom-financial-periods-ui-qa/
            build/xer-actual-cost-import-native.png
            build/xer-actual-cost-export-native.png
            build/primavera-export.xer
            build/primavera-24h.xer
            build/primavera-export.json
            build/primavera-xer-*-native.png
          if-no-files-found: warn
      - name: Preserve Project XML evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: project-xml-${{ runner.os }}
          path: |
            build/project-xml-export.xml
            build/project-xml-export.json
            build/project-xml-preview-native.png
            build/project-xml-import-native.png
            build/project-xml-export-native.png
          if-no-files-found: warn
      - name: Preserve native UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: task-editing-ui-${{ runner.os }}
          path: build/task-editing-native-smoke.png
          if-no-files-found: warn
      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: performance-${{ runner.os }}
          path: build/performance/
          if-no-files-found: warn
